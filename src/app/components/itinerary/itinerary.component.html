<section class="itinerary-section">
  <div class="ship-wheel">
    <i class="fas fa-dharmachakra"></i>
  </div>
  <div class="itinerary-hero-content">
    <h2 class="itinerary-title">¡El Itinerario!</h2>
    <p class="itinerary-subtitle">Todo lo que necesitas saber pa' sobrevivir al finde más plegado del año</p>
    <button class="itinerary-trigger" (click)="openModal()" aria-label="Ver itinerario">
      <i class="fas fa-map-marked-alt"></i>
      <span class="button-text">Ver itinerario completo</span>
    </button>
  </div>
</section>

<!-- Modal con z-index elevado para asegurar que aparezca por encima de todo -->
<div class="modal-overlay" [ngClass]="{'show': isModalOpen}" (click)="closeModalOnOverlayClick($event)" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-title">El itinerario</h2>
      <button class="modal-close" (click)="closeModal()" aria-label="Cerrar">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="itinerary-text">
        <div *ngFor="let day of days" class="day-section">
          <h3 class="day-title">{{ day.title }}</h3>
          <div class="day-content" [innerHTML]="day.content"></div>
        </div>
        <div class="itinerary-attribution">El itinerario: Camilo Torres.</div>
      </div>
    </div>
    <!-- Botón adicional para cerrar en dispositivos móviles -->
    <div class="modal-footer-mobile">
      <button class="close-button-mobile" (click)="closeModal()">Cerrar</button>
    </div>
  </div>
</div>
