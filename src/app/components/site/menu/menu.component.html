<!-- Backdrop overlay -->
<div class="menu-overlay" [class.active]="isMenuOpen" (click)="closeMenu()"></div>

<!-- Fixed hamburger button -->
<button class="menu-toggle" [class.active]="isMenuOpen" (click)="toggleMenu()" aria-label="Menú">
  <span class="bar"></span>
  <span class="bar"></span>
  <span class="bar"></span>
</button>

<!-- Sidebar -->
<nav class="menu-container" [class.active]="isMenuOpen">

  <!-- Sidebar header -->
  <div class="menu-header">
    <span class="menu-brand">Origami Bogotá</span>
    <button class="menu-close" (click)="closeMenu()" aria-label="Cerrar menú">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M2 2L16 16M16 2L2 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Language switcher -->
  <div class="menu-lang-header">
    <button
      *ngFor="let opt of langOptions"
      class="menu-lang-btn"
      [class.active]="opt.code === currentLang()"
      (click)="selectLang(opt.code)"
    >
      <span>{{ opt.flag }}</span>
      <span>{{ opt.label }}</span>
    </button>
  </div>

  <!-- Nav items -->
  <ul class="menu-items">
    <li *ngFor="let item of menuItems" [class.menu-item-featured]="item.featured">
      <a *ngIf="item.type === 'external-page'"
         [href]="item.url"
         target="_blank"
         (click)="closeMenu()"
         [class.menu-link-featured]="item.featured">
         {{ item.name }}
         <span *ngIf="item.featured" class="menu-featured-badge">destacado</span>
      </a>
      <a *ngIf="item.type === 'internal-page'"
         href="javascript:void(0)"
         (click)="handleNavigation(item)"
         [class.menu-link-featured]="item.featured">
         {{ item.name }}
         <span *ngIf="item.featured" class="menu-featured-badge">destacado</span>
      </a>
      <a *ngIf="item.type === 'internal-target'"
         href="javascript:void(0)"
         (click)="handleNavigation(item)"
         [class.menu-link-featured]="item.featured">
         {{ item.name }}
         <span *ngIf="item.featured" class="menu-featured-badge">destacado</span>
      </a>
    </li>
  </ul>

</nav>
